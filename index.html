<style>
:root{
  --ps-bg:#f0f2f6;--ps-header-bg:#1e2d3e;--ps-header-bg2:#192638;
  --ps-card:#fff;--ps-border:#e2e8f0;--ps-text:#1a202c;--ps-muted:#718096;
  --ps-label:#4a5568;--ps-accent:#e8a020;--ps-accent2:#f05a28;--ps-accent-glow:#e8a02033;
  --ps-green:#38a169;--ps-red:#e53e3e;--ps-blue:#3182ce;
  --ps-font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --ps-shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --ps-shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --ps-radius-md:10px;--ps-radius-lg:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ps-font);background:var(--ps-bg);color:var(--ps-text);font-size:14px;line-height:1.5;min-height:100vh}

/* HEADER */
.ps-header{background:linear-gradient(160deg,#253445 0%,var(--ps-header-bg2) 100%);padding:26px 32px 30px;position:relative;overflow:hidden}
.ps-header::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;background:rgba(255,255,255,.03);border-radius:50%}
.ps-header::after{content:'';position:absolute;bottom:-40px;left:30%;width:180px;height:180px;background:rgba(232,160,32,.06);border-radius:50%}
.ps-header-top{display:flex;align-items:center;gap:14px;margin-bottom:6px;position:relative;z-index:1}
.ps-logo img{width:40px;height:40px;object-fit:contain;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ps-header-title{font-weight:700;font-size:26px;color:#fff;letter-spacing:-.3px}
.ps-header-sub{font-size:13px;color:rgba(255,255,255,.55);margin-top:3px}

/* MAIN */
.ps-main{padding:24px 32px;max-width:1400px;margin:0 auto}

/* FILTROS */
.ps-filters{background:var(--ps-card);border:1px solid var(--ps-border);border-radius:var(--ps-radius-lg);padding:16px 20px;box-shadow:var(--ps-shadow-sm);margin-bottom:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.ps-filter-group{flex:1;min-width:150px}
.ps-label{display:block;font-size:11px;font-weight:600;color:var(--ps-label);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.ps-input,.ps-select{width:100%;background:#fff;border:1.5px solid var(--ps-border);border-radius:var(--ps-radius-md);padding:9px 14px;color:var(--ps-text);font-family:var(--ps-font);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.ps-input:focus,.ps-select:focus{border-color:var(--ps-header-bg);box-shadow:0 0 0 3px rgba(26,39,68,.1)}
.ps-btn{padding:9px 18px;border-radius:var(--ps-radius-md);border:1px solid var(--ps-border);background:var(--ps-card);color:var(--ps-text);font-family:var(--ps-font);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--ps-shadow-sm);white-space:nowrap}
.ps-btn:hover{background:#f7fafc;box-shadow:var(--ps-shadow-md)}
.ps-btn-accent{background:linear-gradient(135deg,var(--ps-accent),var(--ps-accent2));border:none;color:#fff;box-shadow:0 4px 12px var(--ps-accent-glow)}
.ps-btn-accent:hover{opacity:.9}

/* KPIs */
.ps-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.ps-card{background:var(--ps-card);border:1px solid var(--ps-border);border-radius:var(--ps-radius-lg);padding:24px 20px;box-shadow:var(--ps-shadow-sm);transition:box-shadow .2s,transform .15s;text-align:center}
.ps-card:hover{box-shadow:var(--ps-shadow-md);transform:translateY(-2px)}
.ps-card-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
.ps-icon-green{background:#48bb78}.ps-icon-red{background:#fc8181}.ps-icon-blue{background:#63b3ed}.ps-icon-orange{background:#f6ad55}.ps-icon-purple{background:#b794f4}
.ps-card-label{font-size:11px;font-weight:600;color:var(--ps-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.ps-card-value{font-weight:700;font-size:36px;color:var(--ps-text);line-height:1.1;margin-bottom:6px}
.ps-card-sub{font-size:12px;color:var(--ps-muted)}

/* TABS */
.ps-tabs{display:flex;background:var(--ps-card);border:1px solid var(--ps-border);border-radius:var(--ps-radius-lg) var(--ps-radius-lg) 0 0;padding:0 12px;box-shadow:var(--ps-shadow-sm);overflow-x:auto}
.ps-tab{padding:14px 22px;font-family:var(--ps-font);font-size:14px;font-weight:500;color:var(--ps-muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;display:flex;align-items:center;gap:8px;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none}
.ps-tab:hover{color:var(--ps-text)}
.ps-tab.active{color:var(--ps-header-bg);border-bottom-color:var(--ps-accent);font-weight:600}

/* CONTENT CARD */
.ps-content-card{background:var(--ps-card);border:1px solid var(--ps-border);border-top:none;border-radius:0 0 var(--ps-radius-lg) var(--ps-radius-lg);padding:20px 24px;box-shadow:var(--ps-shadow-sm);margin-bottom:16px}
.ps-pane{display:none}.ps-pane.active{display:block}

/* TABLA */
.ps-table-wrap{overflow-x:auto;border-radius:var(--ps-radius-md);border:1px solid var(--ps-border)}
.ps-table{width:100%;border-collapse:collapse;font-size:13px}
.ps-table th{text-align:left;padding:11px 16px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ps-muted);background:#f7fafc;border-bottom:1px solid var(--ps-border);white-space:nowrap;cursor:pointer;user-select:none}
.ps-table th:hover{color:var(--ps-text)}
.ps-table td{padding:11px 16px;border-bottom:1px solid var(--ps-border);color:var(--ps-text)}
.ps-table tr:last-child td{border-bottom:none}
.ps-table tbody tr:hover td{background:#f7fafc}
.ps-badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.ps-badge-ok{background:#c6f6d5;color:#276749}
.ps-badge-danger{background:#fed7d7;color:#9b2c2c}
.ps-bar-cell{display:flex;align-items:center;gap:8px}
.ps-bar-track{flex:1;height:8px;background:#edf2f7;border-radius:6px;overflow:hidden;min-width:60px}
.ps-bar-fill{height:100%;background:linear-gradient(90deg,var(--ps-accent),var(--ps-accent2));border-radius:6px}

/* STATES */
.ps-state{text-align:center;padding:60px 20px;color:var(--ps-muted)}
.ps-state-icon{font-size:48px;margin-bottom:12px}
.ps-loader{height:3px;background:linear-gradient(90deg,var(--ps-accent),var(--ps-accent2),var(--ps-accent));background-size:200% 100%;animation:sh 1s linear infinite;border-radius:3px;margin-bottom:20px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ps-err{background:#fed7d7;color:#9b2c2c;border-radius:var(--ps-radius-md);padding:14px 18px;font-weight:600;margin-bottom:16px}

@media(max-width:768px){
  .ps-header{padding:20px}.ps-main{padding:16px}
  .ps-kpi-grid{grid-template-columns:repeat(2,1fr)}
  .ps-filter-group{min-width:120px}
}
</style>
</head>

      <input type="date" class="ps-input" id="f-hasta">

      <select class="ps-select" id="f-recorrido"><option value="">Todos</option></select>

      <label class="ps-label">Empresa</label>
      <select class="ps-select" id="f-empresa"><option value="">Todas</option></select>
    </div>

      <label class="ps-label">Estado</label>
      <select class="ps-select" id="f-estado">
        <option value="">Todos</option>
        <option value="CONFIRMADO">Solo logueados</option>
        <option value="AUSENTE">Solo ausentes</option>
      </select>
    </div>

      <label class="ps-label">Buscar apellido / DNI</label>
      <input type="text" class="ps-input" id="f-busca" placeholder="Ej: Espinosa" oninput="render()">

    <button class="ps-btn ps-btn-accent" onclick="exportXlsx()">📥 Exportar Excel</button>
    <button class="ps-btn" id="btn-agrupar" onclick="toggleAgrupar()">🔗 Agrupar alimentadores: OFF</button>
    <button class="ps-btn" id="btn-admin" onclick="toggleAdmin()">🔒 Modo edición</button>

    <button class="ps-tab active" data-pane="resumen">📊 Por recorrido</button>
    <button class="ps-tab" data-pane="empresa">🏢 Por empresa</button>
    <button class="ps-tab" data-pane="ausentes">⚠️ Ausentes</button>
    <button class="ps-tab" data-pane="detalle">📋 Detalle</button>
    <button class="ps-tab" data-pane="recorridos" id="tab-recorridos" style="display:none">🗺️ Recorridos</button>
  </div>

    <div class="ps-pane active" id="pane-resumen"></div>
    <div class="ps-pane" id="pane-empresa"></div>
    <div class="ps-pane" id="pane-ausentes"></div>
    <div class="ps-pane" id="pane-detalle"></div>
    <div class="ps-pane" id="pane-recorridos"></div>
  </div>

</main>

<script>
const SB_URL='https://acvkgxwkoprftxfutnbq.supabase.co';
const SB_KEY='sb_publishable_oxT-JSRhioj00iI_iy_Sgg_xnyBG8RO';
const SB_TABLE='transporte_embarques';

let RAW=[]; // todos los registros sin filtrar (para poblar selects)
let DATA_ALL=[]; // lo que vino de Supabase con filtros server-side
let DATA=[]; // registros visibles tras búsqueda por apellido/DNI
let ADMIN=false; // modo edición activado con clave
const ADMIN_PASS='Petrosar103!';
let AGRUPAR=false; // agrupar alimentadores (06A,06B) bajo el principal (06)

// Recorrido principal: quita una letra final pegada al número. 'CD-COMODORO 06A' -> 'CD-COMODORO 06'
// Asignación alimentador -> principal, definida manualmente y guardada en Supabase.
// ASIGNACION[nombreAlimentador] = nombrePrincipal
let ASIGNACION={};
function recPrincipal(nombre){
  if(!nombre)return nombre;
  // Si este recorrido es un alimentador con principal asignado, se agrupa bajo ese principal.
  if(ASIGNACION[nombre])return ASIGNACION[nombre];
  // Si no, queda como está (los principales nunca se agrupan entre sí).
  return String(nombre).trim();
}
// Nombre a mostrar según el interruptor
function recView(nombre){return AGRUPAR?recPrincipal(nombre):nombre}

// Número del recorrido (para ordenar mayor a menor). 'CD - RADA TILLY 06A' -> 6
function recNum(nombre){
  const m=String(nombre||'').match(/(\d+)\s*[A-Za-z]?\s*$/);
  return m?parseInt(m[1],10):-1;
}
// Orden menor a mayor por número; a igual número, por nombre asc (06A antes que 06B)
function cmpRecAsc(a,b){
  const na=recNum(a),nb=recNum(b);
  if(na!==nb)return na-nb;
  return String(a).localeCompare(String(b));
}

// Mapa nombreRecorrido->butacas (cada recorrido es independiente, por nombre completo).
let BUTACAS={};
async function loadButacas(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/butacas_recorrido?select=recorrido,butacas,principal_de`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    if(!r.ok)return;
    const arr=await r.json();
    BUTACAS={};ASIGNACION={};
    arr.forEach(x=>{
      if(x.butacas!=null)BUTACAS[x.recorrido]=x.butacas;
      if(x.principal_de)ASIGNACION[x.recorrido]=x.principal_de;
    });
  }catch(_){}
}
// Butacas para un recorrido por su nombre completo. null si no está cargado.
function butacasDe(nombre){
  return (nombre!=null&&BUTACAS[nombre]!=null)?BUTACAS[nombre]:null;
}
// ¿El recorrido es PRINCIPAL? Es el que tiene número SIN letra al final (06, no 06A).
function esPrincipalNombre(nombre){
  return !/(\d+)\s*[A-Za-z]\s*$/.test(String(nombre||''));
}

function msg(html,err){document.getElementById('msg').innerHTML=html?`<div class="${err?'ps-err':''}">${html}</div>`:''}

async function sbFetch(query){
  // Supabase devuelve máximo 1000 filas por request. Paginamos con Range hasta traer todo.
  const PAGE=1000;
  let from=0, all=[];
  while(true){
    const r=await fetch(`${SB_URL}/rest/v1/${SB_TABLE}?${query}`,{
      headers:{
        'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,
        'Range-Unit':'items','Range':`${from}-${from+PAGE-1}`
      }
    });
    if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' — '+t)}
    const chunk=await r.json();
    all=all.concat(chunk);
    if(chunk.length<PAGE)break;     // última tanda
    from+=PAGE;
    if(from>200000)break;           // tope de seguridad
  }
  return all;
}

async function loadData(){
  msg('<div class="ps-loader"></div>');
  try{
    // Si no hay registros aún en RAW, traer solo recorrido+empresa (liviano) para poblar selects
    if(!RAW.length){
      RAW=await sbFetch('select=recorrido,empresa&order=fecha.desc');
      populateSelects();
    }
    await loadButacas();
    // Construir filtro server-side (Supabase filtra; sbFetch pagina hasta traer todo)
    const params=['select=*','order=fecha.desc,recorrido.asc,parada.asc'];
    const d=document.getElementById('f-desde').value;
    const h=document.getElementById('f-hasta').value;
    const rec=document.getElementById('f-recorrido').value;
    const emp=document.getElementById('f-empresa').value;
    const est=document.getElementById('f-estado').value;
    if(d)params.push('fecha=gte.'+d);
    if(h)params.push('fecha=lte.'+h);
    if(rec)params.push('recorrido=eq.'+encodeURIComponent(rec));
    if(emp)params.push('empresa=eq.'+encodeURIComponent(emp));
    if(est)params.push('estado=eq.'+encodeURIComponent(est));
    DATA_ALL=await sbFetch(params.join('&'));
    msg('');
    render();
  }catch(e){
    msg('⚠️ No se pudieron cargar los datos. '+e.message,true);
    document.getElementById('kpis').innerHTML='';
  }
}

function populateSelects(){
  const recs=[...new Set(RAW.map(r=>r.recorrido).filter(Boolean))].sort(cmpRecAsc);
  const emps=[...new Set(RAW.map(r=>r.empresa).filter(Boolean))].sort();
  const sr=document.getElementById('f-recorrido');
  const se=document.getElementById('f-empresa');
  recs.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sr.appendChild(o)});
  emps.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;se.appendChild(o)});
}

function render(){
  // Aplica búsqueda por apellido/DNI sobre lo cargado
  const q=document.getElementById('f-busca').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const qd=document.getElementById('f-busca').value.replace(/\D/g,'');
  if(q.length<2&&qd.length<3){
    DATA=DATA_ALL.slice();
  }else{
    DATA=DATA_ALL.filter(r=>{
      const nm=String(r.nombre_pasajero||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const dn=String(r.dni||'').replace(/\D/g,'');
      return (q.length>=2&&nm.includes(q))||(qd.length>=3&&dn.includes(qd));
    });
  }
  renderKpis();
  renderResumen();
  renderEmpresa();
  renderAusentes();
  renderDetalle();
}

  const recs=new Set(DATA.map(r=>recView(r.recorrido))).size;

    <div class="ps-card"><div class="ps-card-icon ps-icon-blue">🚌</div><div class="ps-card-label">Recorridos</div><div class="ps-card-value">${recs}</div><div class="ps-card-sub">con embarques</div></div>
    <div class="ps-card"><div class="ps-card-icon ps-icon-purple">👥</div><div class="ps-card-label">Pasajeros</div><div class="ps-card-value">${tot}</div><div class="ps-card-sub">total registrados</div></div>
    <div class="ps-card"><div class="ps-card-icon ps-icon-green">✅</div><div class="ps-card-label">Confirmados</div><div class="ps-card-value">${conf}</div><div class="ps-card-sub">${pct}% del total</div></div>
    <div class="ps-card"><div class="ps-card-icon ps-icon-red">⚠️</div><div class="ps-card-label">Ausentes</div><div class="ps-card-value">${aus}</div><div class="ps-card-sub">no embarcaron</div></div>`;
}

function emptyState(icon,txt){return `<div class="ps-state"><div class="ps-state-icon">${icon}</div>${txt}</div>`}

function renderResumen(){
  const g={};
  DATA.forEach(r=>{
    const rv=recView(r.recorrido);
    const k=r.fecha+'||'+rv;
    if(!g[k])g[k]={fecha:r.fecha,recorrido:rv,tot:0,conf:0};
    g[k].tot++;if(r.estado==='CONFIRMADO')g[k].conf++;
  });
  const rows=Object.values(g).sort((a,b)=>b.fecha.localeCompare(a.fecha)||cmpRecAsc(a.recorrido,b.recorrido));
  if(!rows.length){document.getElementById('pane-resumen').innerHTML=emptyState('📭','No hay registros para los filtros seleccionados.');return}
  const nota=AGRUPAR?'<div style="font-size:13px;color:var(--ps-muted);margin-bottom:10px">🔗 Los alimentadores están sumados a su recorrido principal. Las butacas son las del principal.</div>':'';
  let h=nota+`<div class="ps-table-wrap"><table class="ps-table"><thead><tr><th>Fecha</th><th>Recorrido</th><th>Pasajeros</th><th>Confirmados</th><th>Ausentes</th><th>Butacas</th><th style="width:160px">% Ocupación</th></tr></thead><tbody>`;
  // Acumuladores para la fila de totales
  let tTot=0,tConf=0,tBut=0,tConfConBut=0,recSinBut=0;
  // Lista de principales (recorridos SIN letra) presentes en los datos, para el selector
  const principales=[...new Set(DATA.map(r=>r.recorrido).filter(n=>n&&esPrincipalNombre(n)))].sort(cmpRecAsc);
  rows.forEach(r=>{
    // El nombre de la fila ya es el principal (al agrupar) o el recorrido tal cual (desagrupado),
    // así que las butacas salen directo por ese nombre.
    const but=butacasDe(r.recorrido);
    tTot+=r.tot;tConf+=r.conf;
    if(but!=null&&but>0){tBut+=but;tConfConBut+=r.conf}else{recSinBut++}
    const esAlim=!esPrincipalNombre(r.recorrido); // tiene letra al final
    // Celda de butacas / asignación. Solo interactiva en vista DESAGRUPADA + admin.
    let butCell;
    if(ADMIN && !AGRUPAR){
      if(esAlim){
        // Alimentador: selector "→ pertenece a" (sus butacas no se usan, cuentan las del principal)
        const opts=['<option value="">— sin asignar —</option>'].concat(
          principales.filter(p=>p!==r.recorrido).map(p=>`<option value="${esc(p)}"${ASIGNACION[r.recorrido]===p?' selected':''}>${esc(p)}</option>`)
        ).join('');
        butCell=`<select onchange="setAsignacion('${esc(r.recorrido)}',this.value)" style="font-size:12px;padding:3px 4px;max-width:170px">${opts}</select>`;
      }else{
        // Principal: editor de butacas
        const txt=but!=null?but:'➕ Cargar';
        const color=but!=null?'var(--ps-text)':'var(--ps-accent2)';
        butCell=`<a href="#" onclick="setButacasRec('${esc(r.recorrido)}',${but!=null?but:'null'});return false" style="color:${color};font-weight:600;text-decoration:none;border-bottom:1px dashed currentColor">${txt} ✏️</a>`;
      }
    }else{
      butCell=but!=null?String(but):'—';
    }
    // % de ocupación: los alimentadores en vista desagrupada no tienen ocupación propia significativa,
    // pero igual la mostramos si tienen butacas cargadas. Si no, queda "—".
    if(but!=null&&but>0){
      const pct=Math.round(r.conf/but*100);
      const barPct=Math.min(pct,100); // la barra no pasa de 100% aunque haya sobreventa
      h+=`<tr><td>${fmtFecha(r.fecha)}</td><td><b>${esc(r.recorrido)}</b></td><td>${r.tot}</td><td>${r.conf}</td><td>${r.tot-r.conf}</td><td>${butCell}</td><td><div class="ps-bar-cell"><div class="ps-bar-track"><div class="ps-bar-fill" style="width:${barPct}%"></div></div><span>${pct}%</span></div></td></tr>`;
    }else{
      const txtOc=(esAlim&&!AGRUPAR)?'<span style="color:var(--ps-muted);font-size:12px">alimentador</span>':'<span style="color:var(--ps-muted)">Sin butacas cargadas</span>';
      h+=`<tr><td>${fmtFecha(r.fecha)}</td><td><b>${esc(r.recorrido)}</b></td><td>${r.tot}</td><td>${r.conf}</td><td>${r.tot-r.conf}</td><td>${butCell}</td><td>${txtOc}</td></tr>`;
    }
  });
  // Fila de TOTALES
  const pctTot=tBut>0?Math.round(tConfConBut/tBut*100):0;
  const barTot=Math.min(pctTot,100);
  const ocupCell=tBut>0
    ? `<div class="ps-bar-cell"><div class="ps-bar-track"><div class="ps-bar-fill" style="width:${barTot}%"></div></div><span>${pctTot}%</span></div>`
    : `<span style="color:var(--ps-muted)">—</span>`;
  const avisoSinBut=recSinBut>0?` <span style="font-weight:400;color:var(--ps-muted);font-size:12px">(sin contar ${recSinBut} recorrido${recSinBut!==1?'s':''} sin butacas)</span>`:'';
  h+=`<tr style="background:#f7fafc;font-weight:700;border-top:2px solid var(--ps-border)">
    <td colspan="2">TOTAL${avisoSinBut}</td>
    <td>${tTot}</td>
    <td>${tConf}</td>
    <td>${tTot-tConf}</td>
    <td>${tBut}</td>
    <td>${ocupCell}</td>
  </tr>`;
  h+='</tbody></table></div>';
  document.getElementById('pane-resumen').innerHTML=h;
}

function renderEmpresa(){

  DATA.forEach(r=>{
    const e=r.empresa||'(Sin empresa)';

    g[e].tot++;if(r.estado==='CONFIRMADO')g[e].conf++;
  });
  const rows=Object.values(g).sort((a,b)=>b.tot-a.tot);
  if(!rows.length){document.getElementById('pane-empresa').innerHTML=emptyState('📭','No hay registros.');return}
  let h=`<div class="ps-table-wrap"><table class="ps-table"><thead><tr><th>Empresa</th><th>Pasajeros</th><th>Confirmados</th><th>Ausentes</th><th style="width:160px">% Confirmado</th></tr></thead><tbody>`;
  rows.forEach(r=>{

}

let FILTRO_INTERNO=''; // filtro local de la sección Detalle
function setFiltroInterno(v){FILTRO_INTERNO=v;renderDetalle()}

function renderDetalle(){
  if(!DATA.length){document.getElementById('pane-detalle').innerHTML=emptyState('📭','No hay registros.');return}
  // Internos presentes en los datos actuales (para el selector)
  const internos=[...new Set(DATA.map(r=>r.interno).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
  // Si el interno filtrado ya no está en los datos actuales, limpiar el filtro
  if(FILTRO_INTERNO&&!internos.includes(FILTRO_INTERNO))FILTRO_INTERNO='';
  const opts=['<option value="">Todos los internos</option>']
    .concat(internos.map(i=>`<option value="${esc(i)}"${FILTRO_INTERNO===i?' selected':''}>Interno ${esc(i)}</option>`))
    .join('');
  // Datos filtrados por interno (solo afecta esta tabla)
  const filas=FILTRO_INTERNO?DATA.filter(r=>String(r.interno||'')===FILTRO_INTERNO):DATA;

  const accCol=ADMIN?'<th>Acción</th>':'';
  let h=`<div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <label class="ps-label" style="margin:0">Filtrar por interno:</label>
    <select class="ps-select" style="max-width:220px" onchange="setFiltroInterno(this.value)">${opts}</select>
    <span style="color:var(--ps-muted);font-size:13px">${filas.length} registro${filas.length!==1?'s':''}</span>
  </div>`;
  if(!filas.length){
    h+=emptyState('📭','No hay registros para el interno seleccionado.');
    document.getElementById('pane-detalle').innerHTML=h;
    return;
  }
  h+=`<div class="ps-table-wrap"><table class="ps-table"><thead><tr><th>Fecha</th><th>Recorrido</th><th>Interno</th><th>Parada</th><th>Empresa</th><th>Pasajero</th><th>DNI/Legajo</th><th>Estado</th><th>Hora</th>${accCol}</tr></thead><tbody>`;
  filas.forEach(r=>{
    const badge=r.estado==='CONFIRMADO'?'<span class="ps-badge ps-badge-ok">CONFIRMADO</span>':'<span class="ps-badge ps-badge-danger">AUSENTE</span>';
    let acc='';
    if(ADMIN){
      acc=r.estado==='CONFIRMADO'
        ?`<td><button class="ps-btn" style="padding:6px 12px" onclick="marcarAusente(${r.id})">↩ Pasar a ausente</button></td>`
        :`<td><button class="ps-btn ps-btn-accent" style="padding:6px 12px" onclick="marcarEmbarcado(${r.id})">✅ Marcar embarcado</button></td>`;
    }
    h+=`<tr><td>${fmtFecha(r.fecha)}</td><td>${esc(r.recorrido)}</td><td>${esc(r.interno||'')}</td><td>${esc(r.parada||'')}</td><td>${esc(r.empresa||'')}</td><td><b>${esc(r.nombre_pasajero||'')}</b></td><td>${esc(r.dni||'')}</td><td>${badge}</td><td>${esc(r.hora_embarque||'')}</td>${acc}</tr>`;
  });
  h+='</tbody></table></div>';
  document.getElementById('pane-detalle').innerHTML=h;
}

  const body={estado:nuevoEstado};
  if(nuevoEstado==='CONFIRMADO'){
    const ahora=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    body.hora_embarque=ahora;
  }else{
    body.hora_embarque='';
  }
  const r=await fetch(`${SB_URL}/rest/v1/${SB_TABLE}?id=eq.${id}`,{
    method:'PATCH',
    headers:{
      'Content-Type':'application/json',
      'apikey':SB_KEY,
      'Authorization':'Bearer '+SB_KEY,
      'Prefer':'return=minimal'
    },
    body:JSON.stringify(body)
  });

async function marcarEmbarcado(id){
  if(!ADMIN)return;
  if(!confirm('¿Marcar a este pasajero como EMBARCADO (confirmado)?'))return;
  try{
    await patchEstado(id,'CONFIRMADO');
    // Actualizar en memoria y refrescar
    const rec=DATA_ALL.find(x=>x.id===id);if(rec){rec.estado='CONFIRMADO';rec.hora_embarque=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
    render();
  }catch(e){alert('No se pudo guardar el cambio: '+e.message)}
}

async function marcarAusente(id){
  if(!ADMIN)return;
  if(!confirm('¿Pasar a este pasajero a AUSENTE?'))return;
  try{
    await patchEstado(id,'AUSENTE');
    const rec=DATA_ALL.find(x=>x.id===id);if(rec){rec.estado='AUSENTE';rec.hora_embarque=''}
    render();
  }catch(e){alert('No se pudo guardar el cambio: '+e.message)}
}

        <input type="file" class="ps-input" id="rec-file" accept=".kml" onchange="onRecFile(event)">
      </div>
      <button class="ps-btn ps-btn-accent" onclick="guardarRecorrido()">💾 Guardar</button>
    </div>
    <div id="rec-msg" style="margin-top:10px;font-weight:600;font-size:14px"></div>
  </div>`;
  if(!RECS.length){
    h+=emptyState('🗺️','Todavía no hay recorridos cargados. Subí el primero arriba.');
  }else{
    h+=`<div class="ps-table-wrap"><table class="ps-table"><thead><tr><th>Número</th><th>Nombre</th><th>Última actualización</th><th>Acción</th></tr></thead><tbody>`;
    [...RECS].sort((a,b)=>cmpRecAsc(a.numero,b.numero)).forEach(r=>{
      const fch=r.actualizado_en?new Date(r.actualizado_en).toLocaleString('es-AR'):'';
      h+=`<tr><td><b>${esc(r.numero)}</b></td><td>${esc(r.nombre||'')}</td><td>${fch}</td>
        <td><button class="ps-btn" style="padding:6px 12px;color:var(--ps-red)" onclick="borrarRecorrido(${r.id},'${esc(r.numero)}')">🗑 Eliminar</button></td></tr>`;
    });
    h+='</tbody></table></div>';
  }
  pane.innerHTML=h;
}

function onRecFile(e){
  const f=e.target.files[0];
  if(!f)return;
  if(!f.name.toLowerCase().endsWith('.kml')){document.getElementById('rec-msg').innerHTML='<span style="color:var(--ps-red)">⚠️ Debe ser un archivo .kml</span>';return}
  const reader=new FileReader();
  reader.onload=ev=>{pendingKml=ev.target.result;pendingName=f.name;
    document.getElementById('rec-msg').innerHTML='<span style="color:var(--ps-green)">✓ Archivo leído: '+esc(f.name)+'</span>';
  };
  reader.readAsText(f,'UTF-8');
}

async function guardarRecorrido(){
  const num=document.getElementById('rec-num').value.trim();
  const nom=document.getElementById('rec-nom').value.trim();
  const msg=document.getElementById('rec-msg');
  if(!num){msg.innerHTML='<span style="color:var(--ps-red)">⚠️ Poné el número de recorrido</span>';return}
  if(!pendingKml){msg.innerHTML='<span style="color:var(--ps-red)">⚠️ Seleccioná el archivo KML</span>';return}
  msg.innerHTML='Guardando...';
  const row={numero:num,nombre:nom,kml:pendingKml,actualizado_en:new Date().toISOString()};
  try{
    // upsert por numero (si existe, lo reemplaza)
    const r=await fetch(`${SB_URL}/rest/v1/recorridos?on_conflict=numero`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal,resolution=merge-duplicates'},
      body:JSON.stringify(row)
    });
    if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' — '+t)}
    msg.innerHTML='<span style="color:var(--ps-green)">✅ Recorrido '+esc(num)+' guardado</span>';
    pendingKml=null;pendingName='';
    document.getElementById('rec-num').value='';
    document.getElementById('rec-nom').value='';
    document.getElementById('rec-file').value='';
    loadRecorridos();
  }catch(e){msg.innerHTML='<span style="color:var(--ps-red)">No se pudo guardar: '+e.message+'</span>'}
}

// Cargar/editar butacas desde la tabla "Por recorrido", por NOMBRE COMPLETO.
// Cada recorrido es independiente (su propio colectivo).
async function setButacasRec(nombreRecorrido, actual){
  if(!ADMIN)return;
  const val=prompt('Butacas del recorrido "'+nombreRecorrido+'":', actual!=null?String(actual):'');
  if(val===null)return;
  const but=parseInt(String(val).trim(),10);
  if(isNaN(but)||but<1){alert('Tenés que poner un número mayor a 0.');return}
  try{
    // PATCH primero (si la fila existe). Si no afecta filas, hacemos INSERT.
    let r=await fetch(`${SB_URL}/rest/v1/butacas_recorrido?recorrido=eq.${encodeURIComponent(nombreRecorrido)}`,{
      method:'PATCH',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'},
      body:JSON.stringify({butacas:but})
    });
    if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' — '+t)}
    const upd=await r.json();
    if(!upd.length){
      r=await fetch(`${SB_URL}/rest/v1/butacas_recorrido`,{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
        body:JSON.stringify({recorrido:nombreRecorrido,butacas:but})
      });
      if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' — '+t)}
    }
    await loadButacas();
    render();
  }catch(e){alert('No se pudo guardar las butacas: '+e.message)}
}

// Asigna un alimentador a su recorrido principal (o lo deja sin asignar si value vacío).
async function setAsignacion(nombreAlimentador, nombrePrincipal){
  if(!ADMIN)return;
  const valor=nombrePrincipal||null;
  try{
    let r=await fetch(`${SB_URL}/rest/v1/butacas_recorrido?recorrido=eq.${encodeURIComponent(nombreAlimentador)}`,{
      method:'PATCH',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'},
      body:JSON.stringify({principal_de:valor})
    });
    if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' — '+t)}
    const upd=await r.json();
    if(!upd.length){
      // Fila nueva: butacas es NOT NULL, ponemos 0 (no se usa para alimentadores)
      r=await fetch(`${SB_URL}/rest/v1/butacas_recorrido`,{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
        body:JSON.stringify({recorrido:nombreAlimentador,butacas:0,principal_de:valor})
      });
      if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' — '+t)}
    }
    await loadButacas();
    render();
  }catch(e){alert('No se pudo guardar la asignación: '+e.message)}
}

async function borrarRecorrido(id,num){
  if(!confirm('¿Eliminar el recorrido '+num+'? Esta acción no se puede deshacer.'))return;
  try{
    const r=await fetch(`${SB_URL}/rest/v1/recorridos?id=eq.${id}`,{
      method:'DELETE',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'}
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    loadRecorridos();
  }catch(e){alert('No se pudo eliminar: '+e.message)}
}

function exportXlsx(){
  if(!DATA.length){alert('No hay datos para exportar.');return}
  const aoa=[['Fecha','Recorrido','Interno','Parada','Empresa','Pasajero','DNI/Legajo','Estado','Hora Embarque']];
  DATA.forEach(r=>aoa.push([r.fecha,r.recorrido,r.interno||'',r.parada||'',r.empresa||'',r.nombre_pasajero||'',r.dni||'',r.estado||'',r.hora_embarque||'']));
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:12},{wch:26},{wch:10},{wch:12},{wch:24},{wch:30},{wch:16},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws,'Embarques');
  XLSX.writeFile(wb,'Embarques_PETROSAR_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmtFecha(f){if(!f)return '';const p=String(f).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:f}
